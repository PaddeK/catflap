name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]   # amd64 and native arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod verify
      - run: go vet ./...
      - run: go test ./...
      - name: end-to-end test (relay + homelab + clients on this runner)
        run: tests/e2e.sh

  # setup, restart and uninstall under real systemd, in a throwaway container
  systemd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: tests/systemd.sh

  # All six release targets build, the goreleaser config is valid, and the install
  # scripts install the snapshot on each OS (incl. the tamper checks).
  release-dry-run:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --snapshot --clean
      - if: runner.os != 'Linux'
        name: unit tests on this OS
        run: go test ./...
      - if: runner.os == 'Linux'
        run: shellcheck install.sh tests/install.sh tests/docker.sh tests/systemd.sh
      - if: runner.os != 'Windows'
        run: tests/install.sh dist
      - if: runner.os == 'Windows'
        name: install test (Windows PowerShell 5.1)
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/install.ps1 dist
      - if: runner.os == 'Windows'
        name: install test (PowerShell 7)
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File tests/install.ps1 dist
